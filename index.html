<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>A Realm Divided — Guide de fan non officiel</title>
    <meta
      name="description"
      content="Guide de fan non officiel de Game of Thrones : un voyage de Westeros à Essos, des personnages, des maisons et un codex, sans spoilers au-delà de votre saison."
    />
    <meta name="theme-color" content="#0b0d0e" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="/fonts/cormorant-garamond-latin-500-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <a class="skip-link" href="#space">Aller au contenu</a>

    <!-- Le monde 3D persistant (§4.3) : créé une fois, jamais retiré de l'écran. -->
    <div class="world" aria-hidden="true">
      <canvas id="world"></canvas>
      <div id="world-labels" class="world-labels"></div>
    </div>
    <div class="plunge" aria-hidden="true"></div>

    <!-- Cadre de filets (§8.2), fixe et inerte. -->
    <div class="frame" aria-hidden="true">
      <span class="frame-fleuron" data-ornament="fleuron"></span>
      <span class="frame-corner tl" data-ornament="corner"></span>
      <span class="frame-corner tr" data-ornament="corner"></span>
      <span class="frame-corner bl" data-ornament="corner"></span>
      <span class="frame-corner br" data-ornament="corner"></span>
    </div>

    <header class="site-header">
      <a class="logo" href="/" aria-label="A Realm Divided, retour à la carte">GOT</a>
      <span class="header-rule" aria-hidden="true"></span>
      <nav class="spaces-nav" aria-label="Espaces">
        <span class="diamond" aria-hidden="true"></span>
        <a href="/" data-space="map">Carte</a>
        <span class="dot" aria-hidden="true">·</span>
        <a href="/personnages" data-space="characters">Personnages</a>
        <span class="dot" aria-hidden="true">·</span>
        <a href="/maisons" data-space="houses">Maisons</a>
        <span class="dot" aria-hidden="true">·</span>
        <a href="/codex" data-space="codex">Codex</a>
        <span class="diamond" aria-hidden="true"></span>
      </nav>
      <span class="header-rule" aria-hidden="true"></span>
      <button type="button" class="season-btn" aria-haspopup="dialog">
        <span class="season-btn-text">Saison 1</span> <span aria-hidden="true">▾</span>
      </button>
      <button type="button" class="icon-btn search-btn" aria-label="Rechercher (Ctrl+K)">
        <svg
          viewBox="0 0 24 24"
          width="20"
          height="20"
          fill="none"
          stroke="currentColor"
          stroke-width="1.2"
          aria-hidden="true"
        >
          <circle cx="10.5" cy="10.5" r="6.5" />
          <path d="m15.5 15.5 5 5" />
        </svg>
      </button>
      <button
        type="button"
        class="icon-btn menu-btn"
        aria-label="Ouvrir le menu"
        aria-expanded="false"
        aria-controls="menu"
      >
        <svg
          viewBox="0 0 24 24"
          width="22"
          height="22"
          fill="none"
          stroke="currentColor"
          stroke-width="1.2"
          aria-hidden="true"
        >
          <path d="M3 7h18M3 12h18M3 17h18" />
        </svg>
      </button>
    </header>

    <main id="space" class="space" tabindex="-1"></main>

    <nav class="bottom-bar" aria-label="Navigation de l’espace">
      <button
        type="button"
        class="icon-btn sound-btn"
        aria-pressed="false"
        aria-label="Activer le son d’ambiance"
      >
        <svg
          viewBox="0 0 24 24"
          width="20"
          height="20"
          fill="none"
          stroke="currentColor"
          stroke-width="1.2"
          aria-hidden="true"
        >
          <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" />
          <path class="wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" />
        </svg>
      </button>
      <span class="bar-rule" aria-hidden="true"></span>
      <a class="bar-prev" href="/" aria-label="Précédent"
        ><span data-ornament="arrow-left"></span><span class="bar-side-label"></span
      ></a>
      <span class="bar-title"></span>
      <a class="bar-next" href="/" aria-label="Suivant"
        ><span class="bar-side-label"></span><span data-ornament="arrow-right"></span
      ></a>
      <span class="bar-rule" aria-hidden="true"></span>
      <span class="bar-count"></span>
    </nav>

    <div id="menu" class="menu" hidden></div>
    <div id="search" class="search" hidden></div>
    <div id="season-picker" class="season-picker" hidden></div>
    <aside id="preview" class="preview" hidden></aside>
    <div class="toast" role="status" aria-live="polite"></div>
    <div id="announcer" class="visually-hidden" aria-live="polite"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
