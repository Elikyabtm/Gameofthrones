<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lab du paysage</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0d0e;
        color: #e8e4da;
        font-family: system-ui, sans-serif;
      }
      #world {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #world-labels {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #lab-info {
        position: fixed;
        left: 12px;
        bottom: 12px;
        font:
          12px/1.4 ui-monospace,
          monospace;
        background: rgb(0 0 0 / 0.55);
        padding: 6px 10px;
      }
    </style>
  </head>
  <body>
    <!-- Page de travail hors build (vite.config.js n'a qu'index.html en entrée) :
         npm run dev puis http://localhost:5173/lab.html -->
    <canvas id="world"></canvas>
    <div id="world-labels"></div>
    <div id="lab-info">chargement…</div>
    <script type="module" src="/src/lab.js"></script>
  </body>
</html>
