<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lab — terrain</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0a1012;
        overflow: hidden;
      }
      #world {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #lab-info {
        position: fixed;
        left: 16px;
        bottom: 16px;
        color: #c9cbbd;
        font:
          12px/1.5 ui-monospace,
          monospace;
        white-space: pre;
        pointer-events: none;
      }
      .shots #lab-info,
      .shots .lil-gui {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="world" aria-hidden="true"></canvas>
    <div id="lab-info">Génération des textures…</div>
    <script type="module" src="/src/lab.js"></script>
  </body>
</html>
